        flex-direction: column;

        align-items: center;
        text-align: center;
        padding: 2rem;
      }

        -webkit-text-fill-color: transparent;
        background-clip: text;

      .subtitle {

        margin-bottom: 2rem;
        opacity: 0.9;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 2rem;
      }

      .link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        white-space: nowrap;
        min-width: fit-content;
      }

      .link-icon {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .link {
        background-color: #2594b2;
        color: white;
        border: 2px solid #2594b2;
      }

      .link:hover {
        background-color: #f92a20;
        border: 2px solid #f92a20;
        color: #000000;
      }

      .confetti {
        position: fixed;
        pointer-events: none;
        z-index: 1000;
      }

        margin-bottom: 1rem;
        color: #2594b2;

    <script>
      class ConfettiPiece {
        constructor() {
          this.x = Math.random() * window.innerWidth;
          this.y = -10;
          this.vx = (Math.random() - 0.5) * 4;
          this.vy = Math.random() * 3 + 2;
          this.rotation = Math.random() * 360;
          this.rotationSpeed = (Math.random() - 0.5) * 10;
          this.size = Math.random() * 8 + 4;
          this.colors = ["#2594B2", "#F92A20", "#ffffff"];
          this.color =
            this.colors[Math.floor(Math.random() * this.colors.length)];
          this.shape = Math.random() > 0.5 ? "circle" : "square";
          this.opacity = 1;
          this.gravity = 0.1;
          this.wind = (Math.random() - 0.5) * 0.5;

          this.element = document.createElement("div");
          this.element.className = "confetti";
          this.element.style.left = this.x + "px";
          this.element.style.top = this.y + "px";
          this.element.style.width = this.size + "px";
          this.element.style.height = this.size + "px";
          this.element.style.backgroundColor = this.color;
          this.element.style.transform = `rotate(${this.rotation}deg)`;
          this.element.style.opacity = this.opacity;

          if (this.shape === "circle") {
            this.element.style.borderRadius = "50%";
          } else {
            this.element.style.borderRadius = "0";
          }

          document.body.appendChild(this.element);
        }

        update() {
          this.vy += this.gravity;
          this.x += this.vx + this.wind;
          this.y += this.vy;
          this.rotation += this.rotationSpeed;

          // Add some wobble
          this.x += Math.sin(this.y * 0.01) * 0.5;

          // Fade out as it falls
          this.opacity = Math.max(0, 1 - this.y / window.innerHeight);

          this.element.style.left = this.x + "px";
          this.element.style.top = this.y + "px";
          this.element.style.transform = `rotate(${this.rotation}deg)`;
          this.element.style.opacity = this.opacity;

          return this.y < window.innerHeight + 50 && this.opacity > 0;
        }

        remove() {
          this.element.remove();
        }
      }

      function startConfetti() {
        const confettiPieces = [];
        const confettiCount = 150;

        // Create initial burst
        for (let i = 0; i < confettiCount; i++) {
          setTimeout(() => {
            confettiPieces.push(new ConfettiPiece());
          }, Math.random() * 500);
        }

        // Animation loop
        function animate() {
          for (let i = confettiPieces.length - 1; i >= 0; i--) {
            const piece = confettiPieces[i];
            if (!piece.update()) {
              piece.remove();
              confettiPieces.splice(i, 1);
            }
          }

          if (confettiPieces.length > 0) {
            requestAnimationFrame(animate);
          }
        }

        requestAnimationFrame(animate);
      }

      // Start confetti immediately and also on load event
      if (document.readyState === "loading") {
        window.addEventListener("load", startConfetti);
      } else {
        // DOM is already loaded
        startConfetti();
      }
